<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EV-ICD Follow-up Form V02</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e3a96">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EV-ICD F/U">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8eef8;--paper:#fff;--ink:#0f1f4d;--pen:#1a3aa0;--line:#c9d5ec;--mute:#5a6b8c;--acc:#1e3a96;--accfg:#fff;--fill:#f2f6fd;--head:#1e3a96;--headfg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--paper:#1b202b;--ink:#e8ebf2;--pen:#a9bbff;--line:#3a4256;--mute:#98a0b3;--acc:#8fa8ff;--accfg:#12151c;--fill:#232938;--head:#2a4bb8;--headfg:#fff}}
:root[data-theme="dark"]{--bg:#12151c;--paper:#1b202b;--ink:#e8ebf2;--pen:#a9bbff;--line:#3a4256;--mute:#98a0b3;--acc:#8fa8ff;--accfg:#12151c;--fill:#232938;--head:#2a4bb8;--headfg:#fff}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:10px 10px 0}
.credit{margin:0 4px 6px;font-size:11px;color:var(--mute)}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden}
.sec h2{margin:0;padding:7px 12px;font-size:13px;font-weight:600;background:var(--head);color:var(--headfg);letter-spacing:.3px}
.sec{border-color:var(--head)}
.topbar{background:var(--head);color:var(--headfg);margin:-10px -10px 10px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px}
.topbar b{display:block;font-size:17px;letter-spacing:.3px}
.topbar span{display:block;font-size:11px;opacity:.85}
.topbar .ver{font-size:12px;font-weight:600;opacity:1;margin:1px 0 2px}
.dzc{border-color:var(--line)}
.dzen{color:var(--acc)}
.body{padding:10px 12px 12px}
[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 10px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c6{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}
.f>span,.hd,.f>label{font-size:11px;color:var(--mute);font-weight:500}
.in{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--pen);background:var(--fill);border:1px solid var(--line);border-radius:6px;padding:4px 8px;height:36px}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;padding:6px 9px;line-height:24px;text-align:left}
input[type=date].in::-webkit-date-and-time-value{text-align:left;margin:0;min-height:26px}
input[type=date].in::-webkit-calendar-picker-indicator{margin:0}
.grid>*{min-width:0}
.in:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;background:var(--paper)}
select.in{-webkit-appearance:none;appearance:none;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 11px) 15px,calc(100% - 7px) 15px;background-size:4px 4px;background-repeat:no-repeat}
.in:disabled{opacity:.5}
.line{display:flex;align-items:center;gap:6px}
.line .in{flex:1}
.u{font-size:11px;color:var(--mute);flex:0 0 auto}
.opt{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:30px;cursor:pointer;white-space:nowrap}
.opt input,.ck input,.tg input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.sub{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.tg{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;min-height:28px;cursor:pointer}
/* sensing table */
.tb{display:grid;align-items:center;gap:6px 8px}
.tb.s{grid-template-columns:72px 1fr 1fr 44px}
.rl{font-weight:600;font-size:12px;line-height:1.2}
.ck{display:flex;justify-content:center}
.hd.c{text-align:center}
.vn{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin:-2px 0 3px}
.vn .opt{font-size:11px;color:var(--mute);min-height:26px}
.vn .opt input{width:17px;height:17px}
.vn .in{height:34px;font-size:16px}
/* cards used by Wavelet / Min / zones */
.dzc{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.dzen{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;min-height:30px;cursor:pointer}
.dzen input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.dzbody{margin-top:8px}
.minrow{display:flex;gap:6px;align-items:center}
#dzwrap .dzbody{display:grid;grid-template-columns:1fr;gap:6px 10px}
@media (min-width:520px){#dzwrap .dzbody{grid-template-columns:1fr 1fr}}
.dzc .dzrow{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dzc .dzrow .in{flex:1 1 120px}
.dzrx{display:flex;align-items:center;gap:4px;min-width:0}
.dzrx .dzlab{flex:0 0 28px;font-size:11px;color:var(--mute);font-weight:600}
.dzrx select.in{flex:0 0 80px;font-size:16px;padding:4px 16px 4px 6px}
.dzrx input.in{flex:1}
.dzfill{grid-column:1/-1;justify-self:start;font-size:12px;padding:5px 10px;min-height:32px}
textarea{font:inherit;font-size:16px;color:var(--pen);background:var(--fill);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;min-height:64px;resize:vertical;margin-bottom:4px}
.big{display:flex;align-items:center;gap:7px;min-height:30px;font-weight:600;font-size:13px}
.big input{width:18px;height:18px;accent-color:var(--acc)}
.pv{padding:6px;background:#fff}
canvas{display:block;width:100%;height:auto}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 -10px}
button{font:inherit;font-size:13px;font-weight:600;padding:7px 10px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--accfg);cursor:pointer;min-height:36px}
button.ghost{background:transparent;color:var(--acc)}
.bar button{flex:1 1 0;white-space:nowrap}
.bar #msg{flex-basis:100%;text-align:center}
.bar #msg:empty{display:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#msg{color:var(--mute);font-size:12px}
input,select,textarea{font-size:16px!important}
.seg{display:inline-flex;flex:0 0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--fill)}
.seg button{background:transparent;color:var(--ink);border:0;border-left:1px solid var(--line);border-radius:0;min-height:34px;padding:5px 10px;font-size:13px;font-weight:600}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--acc);color:var(--accfg)}
.dzrow .seg{flex:0 0 auto}
.dzrx .seg button{padding:5px 8px}
.qk{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.qk button{font-size:12px;min-height:32px;padding:5px 10px}
.minrow .seg,.line .seg{flex:0 0 auto}
</style>
</head>
<body>
<main>
<header class="topbar"><b>EV-ICD F/U</b><span class="ver">V02</span><span>Developed by Autthapol K.</span></header>

<div class="sec"><h2>Device</h2><div class="body">
 <div class="grid">
  <label class="f c3"><span>Model</span><input class="in" id="model" value="DVEA3E4" readonly></label>
  <label class="f c3"><span>Follow up date</span><input class="in" type="date" id="date"></label>
  <label class="f c3"><span>DOI</span><input class="in" type="date" id="doi"></label>
  <label class="f c3"><span>Mode</span><input class="in" id="pm" value="OVO"></label>
  <label class="f c2"><span>Rate (bpm)</span><input class="in" id="rate" inputmode="decimal"></label>
  <label class="f c2"><span>Rhythm</span><input class="in" id="rhythm" placeholder="VS"></label>
  <label class="f c2"><span>Battery (V)</span><input class="in" id="batt" inputmode="decimal"></label>
  <label class="f c2"><span>Charge time (sec)</span><input class="in" id="chg" inputmode="decimal"></label>
  <label class="f c2"><span>Charge energy (J)</span><input class="in" id="chgj" inputmode="decimal" placeholder="30"></label>
  <label class="f c2"><span>V-pace episode</span><input class="in" id="vpace" inputmode="decimal"></label>
  <div class="f c6"><label for="yrs">Est. longevity</label>
   <div class="line">
    <label class="opt"><input type="checkbox" id="lt" aria-label="Less than">&lt;</label>
    <input class="in" id="yrs" inputmode="decimal">
    <select class="in" id="yru" style="flex:0 0 80px" aria-label="Longevity unit"><option value="yrs">yrs</option><option value="month">month</option></select>
    <label class="opt"><input type="checkbox" id="init">Initializing</label>
   </div>
  </div>
 </div>
 <div class="dzc">
  <label class="dzen"><input type="checkbox" id="minen" aria-label="Enable Min">Min</label>
  <div class="dzbody minrow" id="minrow" hidden>
   <label class="opt"><input type="checkbox" id="minlt" aria-label="Min less than">&lt;</label>
   <input class="in" id="minval" inputmode="decimal" style="flex:1" aria-label="Min value">
   <select class="in" id="minu" style="flex:0 0 80px" aria-label="Min longevity unit"><option value="yrs">yrs</option><option value="month">month</option></select>
  </div>
 </div>
</div></div>

<div class="sec"><h2>Sensing R wave</h2><div class="body"><div class="tb s">
  <span class="hd">Vector</span><span class="hd">R wave (mV)</span><span class="hd">No PWOs at (mV)</span><span class="hd c">Current</span>
  <span class="rl">Ring1 to Ring2</span><input class="in" id="s1" inputmode="text" placeholder="4.8-4.9" aria-label="Ring1 to Ring2 mV"><input class="in" id="p1" inputmode="decimal" aria-label="Ring1 to Ring2 no PWOs at mV"><span class="ck"><input type="checkbox" id="c1" aria-label="Ring1 to Ring2 current vector"></span>
  <div class="vn"><label class="opt"><input type="checkbox" id="vn1">Add note</label><input class="in" id="vt1" hidden aria-label="Note for Ring1 to Ring2" placeholder="Note for Ring1 to Ring2"></div>
  <span class="rl">Ring1 to Can</span><input class="in" id="s2" inputmode="text" placeholder="4.8-4.9" aria-label="Ring1 to Can mV"><input class="in" id="p2" inputmode="decimal" aria-label="Ring1 to Can no PWOs at mV"><span class="ck"><input type="checkbox" id="c2" aria-label="Ring1 to Can current vector"></span>
  <div class="vn"><label class="opt"><input type="checkbox" id="vn2">Add note</label><input class="in" id="vt2" hidden aria-label="Note for Ring1 to Can" placeholder="Note for Ring1 to Can"></div>
  <span class="rl">Ring2 to Can</span><input class="in" id="s3" inputmode="text" placeholder="4.8-4.9" aria-label="Ring2 to Can mV"><input class="in" id="p3" inputmode="decimal" aria-label="Ring2 to Can no PWOs at mV"><span class="ck"><input type="checkbox" id="c3" aria-label="Ring2 to Can current vector"></span>
  <div class="vn"><label class="opt"><input type="checkbox" id="vn3">Add note</label><input class="in" id="vt3" hidden aria-label="Note for Ring2 to Can" placeholder="Note for Ring2 to Can"></div>
</div>
<div class="qk" style="margin-top:8px"><button type="button" class="ghost" id="pwoall">Use same "No PWOs at" for all vectors</button></div></div></div>

<div class="sec"><h2>Impedance (Ω)</h2><div class="body"><div class="grid">
  <label class="f c2"><span>Ring1 to Ring2</span><input class="in" id="i1" inputmode="decimal" aria-label="Ring1 to Ring2 impedance"></label>
  <label class="f c2"><span>Ring1 to Coil2</span><input class="in" id="i2" inputmode="decimal" aria-label="Ring1 to Coil2 impedance"></label>
  <label class="f c2"><span>High Voltage</span><input class="in" id="i3" inputmode="decimal" aria-label="High voltage impedance"></label>
</div></div></div>

<div class="sec"><h2>Threshold</h2><div class="body">
  <div class="line"><input class="in" id="t1v" inputmode="decimal" placeholder="V" aria-label="Threshold volts"><span class="u">V @</span><input class="in" id="t1m" inputmode="decimal" placeholder="ms" aria-label="Threshold pulse width ms"><span class="u">ms</span></div>
</div></div>

<div class="sec"><h2>Wavelet</h2><div class="body">
  <div class="dzc" style="margin-top:0">
    <label class="dzen"><input type="checkbox" id="wven" aria-label="Enable Wavelet">Wavelet</label>
    <div class="dzbody grid" id="wvbody" hidden>
      <label class="f" style="grid-column:span 4"><span>Wavelet vector(EGM2)</span>
        <select class="in" id="wvvec" aria-label="Wavelet vector"><option selected>Coil2 to Can</option><option>Ring1 to Ring2</option><option>Ring1 to Coil1</option><option>Ring1 to Coil2</option><option>Coil1 to Can</option><option>Ring1 to Can</option><option>Ring2 to Can</option><option>Coil2 to Coil1</option></select>
      </label>
      <label class="f c2"><span>% Matching</span><input class="in" id="wvpct" inputmode="decimal" aria-label="Wavelet percent matching"></label>
    </div>
  </div>
</div></div>

<div class="sec"><h2>Setting</h2><div class="body"><div class="grid">
  <div class="f" style="grid-column:span 4"><span>Output (V @ ms)</span>
   <div class="line"><input class="in" id="ov" inputmode="decimal" placeholder="V" aria-label="Output volts"><span class="u">V @</span><input class="in" id="om" inputmode="decimal" placeholder="ms" aria-label="Output pulse width ms"><span class="u">ms</span></div>
  </div>
  <label class="f c2"><span>Sensitivity (mV)</span><input class="in" id="sens" inputmode="decimal" aria-label="Sensitivity mV"></label>
</div></div></div>

<div class="sec"><h2>Detection zone</h2><div class="body" style="padding-top:2px">
  <div id="dzwrap"></div>
</div></div>

<div class="sec"><h2>Note</h2><div class="body">
  <textarea id="note" aria-label="Note" placeholder="Sensing &amp; PWOs, events, plan"></textarea>
  <label class="big"><input type="checkbox" id="noep">No episode</label>
</div></div>

<div class="sec"><h2>Export preview</h2><div class="pv"><canvas id="cv" width="1170" height="1500" aria-label="Preview of exported form"></canvas></div></div>
</main>
<div class="bar" style="justify-content:center">
  <button id="png">Save PNG</button>
  <button id="pdf">Save PDF</button>
  <button class="ghost" id="copy">Copy text</button>
  <button class="ghost" id="clear">Clear</button>
  <span id="msg" role="status"></span>
</div>
<script>
const $=id=>document.getElementById(id),v=id=>$(id).value.trim();
const W=1170,L=74,R=1096,BLUE="#233a8f",INK="#111",FF="Helvetica,Arial,sans-serif";
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fd(s){if(!s)return"";const p=s.split("-");return +p[2]+" "+MON[p[1]-1]+" "+p[0]}
$("date").value=today();

function render(cv,H){
  cv.width=W;cv.height=H;const c=cv.getContext("2d");
  c.fillStyle="#fff";c.fillRect(0,0,W,H);
  const T=(t,x,y,o={})=>{c.font=(o.w||400)+" "+(o.s||34)+"px "+FF;c.fillStyle=o.c||BLUE;c.textAlign=o.a||"left";c.textBaseline="alphabetic";c.fillText(t,x,y)};
  const M=(t,s=34,w=400)=>{c.font=w+" "+s+"px "+FF;return c.measureText(t).width};
  const ln=(x1,x2,y,lw=2)=>{c.strokeStyle=BLUE;c.lineWidth=lw;c.beginPath();c.moveTo(x1,y);c.lineTo(x2,y);c.stroke()};
  const U=(val,x1,x2,y,s=34)=>{ln(x1,x2,y+12);T(val||"-",(x1+x2)/2,y,{c:INK,w:600,s:s,a:"center"})};
  const F=(lab,val,x1,x2,y,unit)=>{T(lab,x1,y);let e=x2;if(unit){T(unit,x2,y,{a:"right"});e=x2-M(unit)-10}U(val,x1+M(lab)+14,e,y)};
  const box=(x,y,on)=>{c.strokeStyle=BLUE;c.lineWidth=3;c.strokeRect(x,y,30,30);if(on){c.strokeStyle=INK;c.lineWidth=5;c.beginPath();c.moveTo(x+6,y+16);c.lineTo(x+13,y+23);c.lineTo(x+25,y+7);c.stroke()}};
  const wrap=(t,s=36,mx=1060,w=600)=>{const out=[];let cur="";for(const tok of t.split(/(?<=\s)/)){if(M(cur+tok,s,w)<=mx){cur+=tok;continue}
    if(cur){out.push(cur.trimEnd());cur=""}let part="";for(const ch of tok){if(M(part+ch,s,w)>mx){out.push(part);part=""}part+=ch}cur=part}
    if(cur)out.push(cur.trimEnd());return out};

  T(v("rhythm"),60,66,{c:INK,w:700,s:42});
  const top=104;
  T("Medtronic",74,top+100,{s:66,w:700});
  F("Follow up date",fd($("date").value),484,R,top+88);
  let y=top+178;T("EV-ICD F/U",74,y,{s:40,w:700});ln(L,R,y+24);
  y+=98;F("Model",v("model"),L,570,y);F("DOI",fd($("doi").value),600,R,y);
  y+=74;F("Mode",v("pm"),L,570,y);if(v("rate"))F("Rate",v("rate"),600,R,y,"bpm");
  y+=74;F("Battery",v("batt"),L,570,y,"V");
  if($("init").checked)F("est.","Initializing",600,R,y);
  else{const lt=($("lt").checked&&v("yrs"))?"<":"",unit=unitWord(v("yrs"),$("yru").value);F("est.",v("yrs")?lt+v("yrs"):"",600,R,y,unit)}
  if($("minen").checked&&v("minval")){y+=74;const mlt=$("minlt").checked?"<":"";F("min",mlt+v("minval"),600,R,y,unitWord(v("minval"),$("minu").value))}
  y+=74;F("Charge time(s)",[v("chg"),v("chgj")&&("@ "+v("chgj")+" J")].filter(Boolean).join(" "),L,570,y);if(v("vpace"))F("V-pace episode",v("vpace"),600,R,y);

  y+=94;T("Sensing R wave",L,y,{c:INK,w:700,s:36});
  y+=56;T("R wave (mV)",L,y,{c:INK,w:600,s:28});T("PWOs testing (mV)",510,y,{c:INK,w:600,s:28});
  [["Ring1 to Ring2","s1","p1","c1"],["Ring1 to Can","s2","p2","c2"],["Ring2 to Can","s3","p3","c3"]].forEach(r=>{
    y+=68;T(r[0],L,y,{s:30});U(v(r[1]),295,455,y,30);T("mV",463,y,{s:30});
    T("no PWOs at",525,y,{s:30});U(v(r[2]),695,800,y,30);T("mV",808,y,{s:30});
    box(868,y-26,$(r[3]).checked);T("current vector",908,y,{s:26});
    const k=r[3].slice(1);if($("vn"+k).checked&&v("vt"+k))wrap("Note: "+v("vt"+k),28,950,500).forEach(t=>{y+=46;T(t,L+20,y,{c:INK,w:500,s:28})});
  });


  y+=94;T("Impedance(Ω)",L,y,{c:INK,w:700,s:36});
  if($("wven").checked){const X=615,wy=y;
    T("Wavelet",X,wy,{c:INK,w:700,s:36});
    T("Wavelet vector(EGM2)",X,wy+68,{s:28});U(v("wvvec")||"-",X+M("Wavelet vector(EGM2)",28)+10,R,wy+68,28);
    T("% Matching",X,wy+136,{s:28});U(v("wvpct")||"-",X+M("Wavelet vector(EGM2)",28)+10,R-40,wy+136,28);T("%",R-30,wy+136,{s:28});
  }
  [["Ring1 to Ring2","i1"],["Ring1 to Coil2","i2"],["High Voltage","i3"]].forEach(r=>{
    y+=68;T(r[0],L,y,{s:30});U(v(r[1]),300,560,y,30);T("Ω",570,y,{s:30});
  });

  if(v("t1v")||v("t1m")){y+=94;T("Threshold",L,y,{c:INK,w:700,s:36});
  y+=68;U(v("t1v"),260,400,y,30);T("V @",410,y,{s:30});U(v("t1m"),485,590,y,30);T("ms",598,y,{s:30})}

  y+=94;T("Setting",L,y,{c:INK,w:700,s:36});
  if(v("ov")||v("om")){y+=68;T("Output",L,y,{s:30});U(v("ov"),260,400,y,30);T("V @",410,y,{s:30});U(v("om"),485,590,y,30);T("ms",598,y,{s:30})}
  y+=68;T("Sensitivity",L,y,{s:30});U(v("sens")||"-",400,560,y,30);T("mV",570,y,{s:30});
  const zl=DZ.map(z=>zoneLine(z[0],z[1])).filter(Boolean);
  if(zl.length){y+=94;T("Detection",L,y,{c:INK,w:700,s:36});T("Rates",354,y,{c:INK,w:700,s:36});T("Therapies",590,y,{c:INK,w:700,s:36});
    const avail=R-590;
    zl.forEach(r=>{y+=56;T(r.lab,L,y,{c:INK,w:600,s:27});T(r.mode,L+150,y,{c:INK,w:400,s:27});T(r.rate,354,y,{c:INK,w:400,s:24});
      let fs=25,tw=M(r.th,fs,500);if(tw>avail)fs=Math.max(14,Math.floor(fs*avail/tw));
      T(r.th,590,y,{c:INK,w:500,s:fs})})
  }

  const bb=y+56;c.strokeStyle=BLUE;c.lineWidth=6;c.strokeRect(44,top,1082,bb-top);
  let lines=[];if($("noep").checked)lines.push("No episode");
  v("note").split("\n").forEach(t=>{if(t.trim())lines=lines.concat(wrap(t.trim(),36,1060,600))});
  let e=bb+40;
  if(lines.length){let fy=bb+66;lines.forEach(t=>{T(t,60,fy,{c:INK,w:600,s:36});fy+=52});e=fy-8}
  return Math.ceil(e);
}
const DZ=[["vf","VF"],["fvt","FVT"],["vt","VT"],["vtm","VT Monitor"]];
function rxPh(sel){const m=sel.id.match(/^dz(\w+?)s(\d)$/);if(!m)return;const inp=document.getElementById("dz"+m[1]+"v"+m[2]);if(!inp)return;
  inp.placeholder=sel.value==="J"?"e.g. 40":(sel.value==="B"||sel.value==="R")?"e.g. 15":""}
document.addEventListener("change",e=>{if(e.target.tagName==="SELECT")rxPh(e.target)});
document.getElementById("wven").addEventListener("change",e=>{document.getElementById("wvbody").hidden=!e.target.checked;redraw()});
document.getElementById("minen").addEventListener("change",e=>{document.getElementById("minrow").hidden=!e.target.checked;redraw()});
function unitWord(val,sel){const n=parseFloat(val);if(sel!=="month")return n>1?"yrs":"yr";return n>1?"months":"month"}
function waveletInfo(){if(!$("wven").checked)return null;
  const vec=v("wvvec")||"-",pct=v("wvpct");
  return{l1:"Wavelet: "+vec,l2:pct?("% Matching: "+pct+"%"):null}}
(function buildZones(){
  const w=document.getElementById("dzwrap"),TYPES='<option value="">-</option><option value="J">Joules</option><option value="B">Burst</option><option value="R">Ramp</option>';
  DZ.forEach(([k,lab])=>{
    const hasRx=k!=="vtm";
    const c=document.createElement("div");c.className="dzc";
    c.innerHTML='<label class="dzen"><input type="checkbox" id="dz'+k+'en" aria-label="Enable '+lab+'">'+lab+'</label>'+
      '<div class="dzbody" id="dz'+k+'body" hidden>'+
      '<div class="dzrow"><select class="in" id="dz'+k+'m" aria-label="'+lab+' mode"><option value="">-</option><option>On</option><option>Off</option>'+(k==="fvt"?'<option>via VF</option><option>via VT</option>':'')+'</select>'+
      '<input class="in" id="dz'+k+'r" inputmode="text" placeholder="e.g. 200-250" aria-label="'+lab+' rate bpm">'+
      '<span class="hd" style="flex:0 0 auto">bpm</span></div>'+
      (hasRx?([1,2,3,4,5,6].map(i=>'<div class="dzrx"><span class="dzlab">RX'+i+'</span>'+
        '<select class="in" id="dz'+k+'s'+i+'" aria-label="'+lab+' RX'+i+' type">'+TYPES+'</select>'+
        '<input class="in" id="dz'+k+'v'+i+'" inputmode="decimal" aria-label="'+lab+' RX'+i+' value"></div>').join("")+
      '<button type="button" class="ghost dzfill" id="dz'+k+'fill">Fill RX2-6 same as RX1</button>'):"")+
      '</div>';
    w.appendChild(c);
    document.getElementById("dz"+k+"en").addEventListener("change",e=>{
      document.getElementById("dz"+k+"body").hidden=!e.target.checked;redraw();
    });
    if(hasRx)document.getElementById("dz"+k+"fill").addEventListener("click",()=>{
      const t=$("dz"+k+"s1").value,val=v("dz"+k+"v1");
      for(let i=2;i<=6;i++){$("dz"+k+"s"+i).value=t;$("dz"+k+"v"+i).value=val;rxPh($("dz"+k+"s"+i))}
      redraw();
    });
  });
})();
function buildTherapies(k){
  const out=[];
  for(let i=1;i<=6;i++){const el=document.getElementById("dz"+k+"v"+i);if(!el)break;
    const val=v("dz"+k+"v"+i),t=$("dz"+k+"s"+i).value;if(!val||!t)continue;
    const last=out[out.length-1];
    if(t==="J"&&last&&last.t==="J"&&last.v===val)last.c++;else out.push({t,v:val,c:1})}
  return out.map(o=>o.t==="J"?(o.v+"J"+(o.c>1?" x "+o.c:"")):o.t==="B"?("Burst("+o.v+")"):("Ramp("+o.v+")")).join(", ")
}
function zoneLine(k,lab){
  if(!$("dz"+k+"en").checked)return null;
  return{lab,mode:v("dz"+k+"m")||"-",rate:v("dz"+k+"r")?v("dz"+k+"r")+" bpm":"-",th:buildTherapies(k)||"-"}
}
const cv=$("cv"),sc=document.createElement("canvas");let raf=0;

function say(t){$("msg").textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$("msg").textContent="",3000)}
function pdfBlob(jpg,w,h){
  const pw=595,ph=842,m=30;let iw=pw-2*m,ih=iw*h/w;if(ih>ph-2*m){ih=ph-2*m;iw=ih*w/h}
  const x=(pw-iw)/2,enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const add=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);len+=b.length};
  const obj=(n,body)=>{offs[n]=len;add(n+" 0 obj\n");body.forEach(add);add("\nendobj\n")};
  add("%PDF-1.4\n");
  obj(1,["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2,["<< /Type /Pages /Kids [3 0 R] /Count 1 >>"]);
  obj(3,["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>"]);
  obj(4,["<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n",jpg,"\nendstream"]);
  const cs="q "+iw.toFixed(2)+" 0 0 "+ih.toFixed(2)+" "+x.toFixed(2)+" "+(ph-m-ih).toFixed(2)+" cm /Im0 Do Q";
  obj(5,["<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream"]);
  const xr=len;let t="xref\n0 6\n0000000000 65535 f \n";
  for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  add(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
  return new Blob(parts,{type:"application/pdf"});
}
function dlLink(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function out(blob,name){
  let dl=null;try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(dl){await dl.save({filename:name,data:blob});return}
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})&&/Android|iPhone|iPad|Macintosh/i.test(navigator.userAgent)&&("ontouchend" in document)){
    try{await navigator.share({files:[f]});return}catch(e){if(e&&e.name==="AbortError")throw e}
  }
  dlLink(blob,name)
}
async function save(fmt){
  const base="EV-ICD_FU_"+($("date").value||"form");
  try{
    redraw();
    let blob;
    if(fmt==="png")blob=await new Promise((r,j)=>cv.toBlob(b=>b?r(b):j(new Error("toBlob")),"image/png"));
    else{const bin=atob(cv.toDataURL("image/jpeg",0.95).split(",")[1]),u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);blob=pdfBlob(u,cv.width,cv.height)}
    await out(blob,base+"."+fmt);say("Saved");
  }catch(e){say(e&&(e.name==="AbortError"||e.code==="declined")?"Cancelled":"Could not save: "+((e&&e.message)||e))}
}
$("png").onclick=()=>save("png");$("pdf").onclick=()=>save("pdf");

function summary(){
  const n=x=>v(x)||"-",IND=" ".repeat(21),L=[];
  L.push("EV-ICD F/U  "+(fd($("date").value)||"-"),"");
  L.push("Model: "+n("model")+"  DOI: "+(fd($("doi").value)||"-"));
  L.push("Mode: "+n("pm")+(v("rate")?("  Rate: "+n("rate")+" bpm"):""));
  L.push("Rhythm: "+n("rhythm"));
  L.push("Battery: "+n("batt")+" V (est. "+($("init").checked?"Initializing":(($("lt").checked&&v("yrs"))?"<":"")+n("yrs")+" "+unitWord(v("yrs"),$("yru").value))+")");
  if($("minen").checked&&v("minval"))L.push("min "+($("minlt").checked?"<":"")+v("minval")+" "+unitWord(v("minval"),$("minu").value));
  const ct=[v("chg")&&(v("chg")+" sec"),v("chgj")&&("@ "+v("chgj")+" J")].filter(Boolean).join(" ");
  if(ct)L.push("Charge time: "+ct);
  if(v("vpace"))L.push("V-pace episode: "+v("vpace"));
  L.push("","Sensing R wave");
  [["R1-R2","s1","p1","c1"],["R1-Can","s2","p2","c2"],["R2-Can","s3","p3","c3"]].forEach(r=>{
    const k=r[3].slice(1);
    L.push(r[0]+" "+n(r[1])+" mV,","no PWOs at "+n(r[2])+" mV"+($(r[3]).checked?" [current vector]":""));
    if($("vn"+k).checked&&v("vt"+k))L.push("| Note: "+v("vt"+k));
    L.push("");
  });
  L.push("Impedance: R1-R2 "+n("i1")+" Ω,",IND+"R1-Coil2 "+n("i2")+" Ω,",IND+"HV "+n("i3")+" Ω");
  if(v("t1v")||v("t1m"))L.push("Threshold: "+n("t1v")+" V @ "+n("t1m")+" ms");
  L.push("","Setting");
  if(v("ov")||v("om"))L.push("Output: "+n("ov")+" V @ "+n("om")+" ms");
  L.push("Sensitivity: "+n("sens")+" mV");
  {const wv=waveletInfo();if(wv){L.push(wv.l1);if(wv.l2)L.push(wv.l2)}}
  const zl2=DZ.map(z=>zoneLine(z[0],z[1])).filter(Boolean);
  if(zl2.length){
    const pad=(t,w)=>t+" ".repeat(Math.max(2,w-t.length));
    const c1=zl2.map(r=>"- "+r.lab+" "+r.mode),w1=Math.max(9,...c1.map(t=>t.length))+2,w2=Math.max(5,...zl2.map(r=>r.rate.length))+3;
    L.push("",pad("Detection",w1)+pad("Rates",w2)+"Therapies");
    zl2.forEach((r,i)=>{L.push((r.th&&r.th!=="-")?pad(c1[i],w1)+pad(r.rate,w2)+r.th:(pad(c1[i],w1)+r.rate).trimEnd())})
  }
  const tail=[];if($("noep").checked)tail.push("No episode");if(v("note"))tail.push(v("note"));
  if(tail.length)L.push("",...tail);
  return L.join("\n");
}

/* ---- V02 easier input: segmented buttons instead of dropdowns ---- */
function segify(sel,labels){
  if(!sel||sel.dataset.seg)return;sel.dataset.seg="1";sel.hidden=true;
  const g=document.createElement("div");g.className="seg";g.setAttribute("role","group");
  const opts=[...sel.options].filter(o=>o.value!=="");
  opts.forEach(o=>{const b=document.createElement("button");b.type="button";b.textContent=(labels&&labels[o.value])||o.text;b.dataset.v=o.value;
    b.onclick=()=>{const blank=[...sel.options].some(x=>x.value==="");sel.value=(sel.value===o.value&&blank)?"":o.value;
      sel.dispatchEvent(new Event("input",{bubbles:true}));sel.dispatchEvent(new Event("change",{bubbles:true}))};g.appendChild(b)});
  const paint=()=>[...g.children].forEach(b=>b.classList.toggle("on",b.dataset.v===sel.value));
  sel.addEventListener("change",paint);paint();sel.after(g);
}
DZ.forEach(([k])=>{segify($("dz"+k+"m"));for(let i=1;i<=6;i++)segify(document.getElementById("dz"+k+"s"+i),{J:"J",B:"Burst",R:"Ramp"});

  if(fill){const q=document.createElement("div");q.className="qk";

    fill.before(q);q.appendChild(b);q.appendChild(fill);}

});
